name: Model-free checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.11.15'
          enable-cache: true
      - run: uv sync --frozen --python 3.11 --extra video --extra dev
      - run: .venv/bin/python -m pytest -q
      - run: .venv/bin/ruff check src tests scripts integration_tests
      - run: .venv/bin/ruff format --check src tests scripts integration_tests
      - name: CLI help without model dependencies
        shell: bash
        run: |
          .venv/bin/python -m hepose.cli --help
          for command in doctor run live benchmark compare; do
            .venv/bin/python -m hepose.cli "$command" --help
          done
