[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "he-pose-mtg"
version = "0.1.0"
description = "Shared CLI and result contracts for the HE pose estimation demo"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
video = ["numpy>=1.26,<3", "opencv-python-headless>=4.10,<5"]
client = ["numpy>=1.26,<3", "opencv-python>=4.10,<5"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
hepose = "hepose.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
