[project]
name = "hepose-tar-vitpose-runtime"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "he-pose-mtg",
    "torch==2.0.1+cu118",
    "torchvision==0.15.2+cu118",
    "numpy==1.26.4",
    "opencv-python==4.9.0.80",
    "mmcv==2.1.0",
    "mmengine==0.10.4",
    "mmpose==1.3.1",
    "mmdet==3.2.0",
    "mmpretrain==1.2.0",
    "ultralytics==8.4.202",
    "easydict==1.9",
    "yacs==0.1.8",
    "PyYAML==6.0.1",
    "einops==0.8.0",
    "setuptools==75.8.0",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
he-pose-mtg = { path = "../..", editable = true }
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }
mmcv = { url = "https://download.openmmlab.com/mmcv/dist/cu118/torch2.0.0/mmcv-2.1.0-cp311-cp311-manylinux1_x86_64.whl" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.extra-build-dependencies]
chumpy = ["setuptools==60.2.0", "numpy==1.26.4", "pip==24.3.1"]
