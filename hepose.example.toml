# Copy to hepose.local.toml and replace paths with prepared local environments and files.
# Paths are relative to this file. The python entry preserves virtualenv symlinks.
schema_version = 1

[models.yolo26]
python = ".venv-yolo26/bin/python"
weights = "models/yolo26/yolo26n-pose.pt"
device = "cuda:0"
input_size = 640
# Required for live; use only your assigned GPU UUID.
# gpu_uuid = "GPU-YOUR-ASSIGNED-UUID"

[models.detrpose]
python = ".venv-detrpose/bin/python"
weights = "models/detrpose/model.safetensors"
repository = "third_party/DETRPose"
device = "cuda:0"
input_size = 640
# gpu_uuid = "GPU-YOUR-ASSIGNED-UUID"

[models.tar-vitpose]
python = ".venv-tar/bin/python"
weights = "models/tar-vitpose/tarvitpose_b_17.pt"
pretrained = "models/tar-vitpose/pretrain_model_b.pth"
detector_weights = "models/tar-vitpose/yolo11x.pt"
repository = "third_party/TARViTPose"
config = "models/tar-vitpose/inference.yaml"
device = "cuda:0"
# gpu_uuid = "GPU-YOUR-ASSIGNED-UUID"

# Use this example on a Mac where ssh abert already works.
[live]
remote = "abert"
remote_root = "/home/taku/he-pose-mtg"
remote_python = ".venv-yolo26/bin/python"
remote_config = "hepose.local.toml"
camera = 0
width = 640
height = 480
fps = 25
jpeg_quality = 80
connect_timeout = 5
startup_timeout = 45
io_timeout = 15
session_timeout = 1800
record = false
# Use a new output directory when setting a fixed path.
# output = "outputs/my-live-run"
# network_note = "Mac on lab Wi-Fi; worker on wired LAN"
