<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="212" viewBox="0 0 1120 212" role="img" aria-labelledby="title desc">
  <title id="title">YOLO26 remote live pipeline</title>
  <desc id="desc">Mac captures a camera frame, sends it by SSH to a Linux RTX 3090, and overlays the returned keypoints on the matching frame.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 7 3.5 0 7" fill="none" stroke="#78EBD1" stroke-width="1.2"/>
    </marker>
    <linearGradient id="card" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#182C40"/><stop offset="1" stop-color="#122335"/>
    </linearGradient>
  </defs>
  <rect x=".5" y=".5" width="1119" height="211" rx="16" fill="#0D1828" stroke="#3D5068"/>
  <text x="30" y="34" fill="#96ECD8" font-family="ui-monospace, Consolas, monospace" font-size="14" letter-spacing="2.5">LIVE PIPELINE</text>
  <g fill="url(#card)" stroke="#426179">
    <rect x="30" y="54" width="292" height="124" rx="11"/>
    <rect x="414" y="54" width="292" height="124" rx="11"/>
    <rect x="798" y="54" width="292" height="124" rx="11"/>
  </g>
  <g fill="none" stroke="#78EBD1" stroke-width="2" marker-end="url(#arrow)">
    <path d="M338 103H397"/><path d="M397 132H338"/>
    <path d="M722 103H781"/><path d="M781 132H722"/>
  </g>
  <g font-family="ui-monospace, Consolas, monospace" font-size="13" font-weight="700" fill="#93EBD5" letter-spacing="1.6">
    <text x="51" y="81">01 / CLIENT</text>
    <text x="435" y="81">02 / TRANSPORT</text>
    <text x="819" y="81">03 / WORKER</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#ECF6FF" font-size="27" font-weight="700">
    <text x="50" y="116">Mac</text>
    <text x="434" y="116">SSH tunnel</text>
    <text x="818" y="116">Linux GPU</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#B0C7DC" font-size="17">
    <text x="51" y="149">Camera capture + pose overlay</text>
    <text x="435" y="149">JPEG frames ↔ keypoints</text>
    <text x="819" y="149">YOLO26 on RTX 3090</text>
  </g>
</svg>
